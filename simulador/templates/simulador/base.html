<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}IoTSim · Simulador de decisões · Bzu Tech{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/simulador/img/iotsim-simbolo.png">
  <style>
    /* ===================================================================
       Identidade visual IoTSim (manual da marca + protótipo de média
       fidelidade do time de design)
       Cores da marca: #180E29 (fundo), #FFFFFF (texto), #6D28D9 e #9333EA
       Regras: botões e cards lisos, cantos suaves, sem sombras nem efeitos.
       Fonte: Inter, alternativa gratuita (licença OFL) à Aktiv Grotesk do
       Figma, em todo o site (títulos, textos e valores).
       =================================================================== */
    @font-face {
      font-family: "Inter";
      src: url("/static/simulador/fonts/inter.woff") format("woff");
      font-weight: 100 900; font-display: swap;
    }

    :root {
      /* Fundo e cards */
      --fundo: #180E29;            /* Roxo Noturno Saturado */
      --card: #23173B;             /* Roxo Sombra Fechado */
      --card-hover: #2C1E4A;       /* Roxo interativo (hover) */
      --borda: #3E2B63;            /* Roxo aço contorno (borda inativa) */
      /* Roxos da marca IoTSim */
      --violeta: #9333EA;          /* Botões, cards de destaque, "SIM" do logo */
      --purpura: #9333EA;
      --violeta-escuro: #6D28D9;   /* Hover e alternativa selecionada */
      /* Significado */
      --verde: #10B981;            /* Dado positivo / Com a Bzu */
      --vermelho: #EF4444;         /* Sem IoT */
      /* Texto */
      --texto: #FFFFFF;
      --suave: #B4AFC7;            /* Cinza lavanda */

      --fonte-texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --fonte-titulo: var(--fonte-texto);
      --fonte-dados: var(--fonte-texto);   /* valores usam números alinhados (tabular-nums) */

      --raio: 18px;
      --raio-pequeno: 12px;
      --brilho: 0 0 0 2px #FFFFFF;          /* destaque de seleção, sem brilho */
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--fonte-texto);
      font-size: 17px;               /* público mais velho: texto confortável */
      line-height: 1.6;
      color: var(--texto);
      background: var(--fundo);
    }
    html { background: var(--fundo); }
    a { color: #C4B5FD; }
    a:hover { color: var(--texto); }
    :focus-visible { outline: 3px solid #A78BFA; outline-offset: 3px; }

    /* ---------- Cabeçalho ---------- */
    header { padding: 18px 20px; border-bottom: 1px solid rgba(62, 43, 99, .6); }
    header .conteudo {
      max-width: 960px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .marca { display: flex; align-items: center; min-height: 40px; text-decoration: none; }
    .marca img { height: 40px; width: auto; display: block; }
    .marca .logo-texto { display: none; color: var(--texto); font-weight: 900; font-size: 1.5rem; line-height: 1; }
    .marca .logo-texto span { font-size: .65rem; font-style: italic; font-weight: 700; margin-left: 2px; }
    .marca.sem-imagem img { display: none; }
    .marca.sem-imagem .logo-texto { display: inline; }
    header nav a { color: var(--suave); text-decoration: none; font-weight: 500; margin-left: 20px; }
    header nav a:first-child { margin-left: 0; }
    header nav a:hover { color: var(--texto); }
    .trilha-info { display: flex; align-items: center; gap: 14px; color: var(--suave); font-size: .9rem; }

    /* Indicador de progresso (dots) */
    .pontos { display: inline-flex; gap: 7px; align-items: center; }
    .ponto { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--borda); }
    .ponto.feito { background: var(--violeta); border-color: var(--violeta); }
    .ponto.atual { border-color: #A78BFA; box-shadow: 0 0 10px rgba(167, 139, 250, .7); }

    /* ---------- Estrutura ---------- */
    main { max-width: 960px; margin: 0 auto; padding: 40px 20px 72px; }
    .estreito { max-width: 720px; margin-left: auto; margin-right: auto; }
    .centro { text-align: center; }

    h1, h2, h3 { line-height: 1.25; margin: 0 0 12px; }
    h1 { font-weight: 700; font-size: 2rem; letter-spacing: -.3px; }
    h1.titulo-abertura {
      font-family: var(--fonte-titulo); font-weight: 400;
      font-size: clamp(1.5rem, 4.2vw, 2.4rem); letter-spacing: 1px; text-transform: uppercase;
      text-shadow: 0 0 24px rgba(167, 139, 250, .45);   /* "efeito de brilho" sugerido */
      margin-bottom: 20px;
    }
    h2 { font-weight: 700; font-size: 1.3rem; margin-top: 36px; }
    h3 { font-weight: 700; font-size: 1.1rem; }
    p { margin: 0 0 14px; }
    .suave { color: var(--suave); }
    .lead { font-size: 1.1rem; color: var(--suave); }

    /* Badge (SIMULADOR IOT, RODADA X DE 5, CONSEQUÊNCIA...) */
    .badge {
      display: inline-block;
      font-family: var(--fonte-dados); font-size: .78rem; font-weight: 500;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: #DDD6FE; background: rgba(124, 58, 237, .16);
      border: 1px solid rgba(124, 58, 237, .55); border-radius: 999px;
      padding: 6px 14px; margin-bottom: 18px;
    }
    .badge.verde { color: #A7F3D0; background: rgba(16, 185, 129, .14); border-color: rgba(16, 185, 129, .55); }

    /* Ícone central em círculo */
    .icone-circulo {
      width: 104px; height: 104px; margin: 8px auto 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #DDD6FE;
      background: radial-gradient(circle at 35% 30%, rgba(147, 51, 234, .55), rgba(109, 40, 217, .25) 60%, rgba(35, 23, 59, .9));
      border: 1px solid rgba(167, 139, 250, .5);
      box-shadow: 0 0 40px rgba(124, 58, 237, .45), inset 0 0 24px rgba(167, 139, 250, .25);
    }
    .icone-circulo svg { width: 48px; height: 48px; }
    .icone { width: 24px; height: 24px; flex: 0 0 auto; }
    .icone-quadro {
      width: 48px; height: 48px; border-radius: 14px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      background: rgba(124, 58, 237, .18); color: #C4B5FD;
    }

    /* ---------- Cards ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      padding: 24px;
      margin-bottom: 18px;
    }
    .card.situacao { display: flex; gap: 18px; align-items: flex-start; }
    .card.situacao h3 { font-size: 1.25rem; }
    .grade { display: grid; gap: 16px; }
    .grade.duas { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .grade.etapas { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
    .etapa { margin: 0; }
    .etapa .numero-etapa { font-family: var(--fonte-dados); color: #A78BFA; font-size: .85rem; display: block; margin: 12px 0 4px; }
    .etapa p { color: var(--suave); margin: 0; font-size: .95rem; }

    /* Card sem IoT × com IoT */
    .card.sem { border-top: 4px solid var(--vermelho); }
    .card.com { border-top: 4px solid var(--verde); box-shadow: 0 0 32px rgba(16, 185, 129, .12); }
    .rotulo { font-family: var(--fonte-dados); font-size: .78rem; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px; display: block; }
    .card.sem .rotulo { color: #FCA5A5; }
    .card.com .rotulo { color: #6EE7B7; }

    /* Métricas (fonte de apoio: valores, impacto financeiro, indicadores) */
    .metricas { display: grid; gap: 10px; margin: 16px 0 6px; }
    .metrica { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(62, 43, 99, .7); }
    .metrica:last-child { border-bottom: none; }
    .metrica small { color: var(--suave); font-size: .92rem; }
    .valor { font-family: var(--fonte-dados); font-weight: 800; font-size: 1.15rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .positivo { color: var(--verde); }
    .negativo { color: var(--vermelho); }

    .destaques { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin: 8px 0 18px; }
    .destaque { background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio); padding: 18px 20px; }
    .destaque small { display: block; color: var(--suave); font-size: .88rem; margin-bottom: 6px; }
    .destaque .valor { font-size: 1.5rem; }

    /* Bloco de insight (lâmpada) */
    .insight {
      display: flex; gap: 18px; align-items: flex-start;
      background: linear-gradient(135deg, rgba(124, 58, 237, .22), rgba(147, 51, 234, .08));
      border: 1px solid rgba(124, 58, 237, .5); border-radius: var(--raio);
      padding: 22px 24px; margin: 6px 0 18px;
    }
    .insight .icone-quadro { color: #FDE68A; background: rgba(253, 230, 138, .12); }
    .insight p:last-child { margin: 0; }

    /* Vozes da equipe */
    .vozes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .voz { background: rgba(35, 23, 59, .6); border: 1px dashed var(--borda); border-radius: var(--raio-pequeno); padding: 14px 16px; }
    .voz strong { display: block; }
    .voz small { color: var(--suave); }
    .voz p { margin: 6px 0 0; font-style: italic; }

    /* ---------- Opções de decisão (T4) ---------- */
    .label-decisao { font-family: var(--fonte-dados); letter-spacing: 1.4px; text-transform: uppercase; color: #C4B5FD; font-size: .85rem; margin: 34px 0 14px; display: block; }
    .opcoes { display: grid; gap: 12px; }
    .opcao {
      position: relative; display: flex; gap: 16px; align-items: center;
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio);
      padding: 18px 20px; cursor: pointer;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .opcao:hover { background: var(--card-hover); }
    .opcao input { position: absolute; opacity: 0; pointer-events: none; }
    .opcao:has(input:checked) { background: var(--card-hover); border-color: var(--violeta); box-shadow: var(--brilho); }
    .opcao:has(input:focus-visible) { outline: 3px solid #A78BFA; outline-offset: 3px; }
    .opcao .letra {
      flex: 0 0 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--fonte-dados); font-weight: 800; text-transform: uppercase;
      border: 1px solid var(--borda); color: #C4B5FD;
    }
    .opcao:has(input:checked) .letra { background: var(--violeta); border-color: var(--violeta); color: #fff; }
    .opcao .titulo-opcao { font-weight: 600; display: block; }
    .opcao .descricao-opcao { color: var(--suave); font-size: .9rem; font-family: var(--fonte-dados); }

    /* ---------- Botões ---------- */
    .botao {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 54px; padding: 0 28px;
      font-family: var(--fonte-texto); font-size: 1.05rem; font-weight: 600;
      color: #fff; text-decoration: none; cursor: pointer;
      background: linear-gradient(135deg, var(--violeta), var(--purpura));
      border: none; border-radius: var(--raio-pequeno);
      box-shadow: 0 6px 24px rgba(124, 58, 237, .35);
      transition: box-shadow .15s, transform .15s;
    }
    .botao:hover { color: #fff; box-shadow: 0 0 0 1px #A78BFA, 0 8px 32px rgba(147, 51, 234, .6); transform: translateY(-1px); }
    .botao.secundario { background: transparent; border: 1px solid var(--borda); box-shadow: none; color: var(--texto); }
    .botao.secundario:hover { background: var(--card); box-shadow: none; }
    .acoes { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 28px; }
    .centro .acoes { justify-content: center; }

    /* ---------- Formulário (nome e empresa) ---------- */
    .campo { margin-bottom: 16px; }
    .campo label { display: block; font-weight: 500; margin-bottom: 6px; }
    .campo input {
      width: 100%; min-height: 52px; padding: 12px 14px;
      font-family: var(--fonte-texto); font-size: 1rem; color: var(--texto);
      background: rgba(24, 14, 41, .7); border: 1px solid var(--borda); border-radius: var(--raio-pequeno);
    }
    .campo input::placeholder { color: #7D7593; }
    .campo input:focus { outline: none; border-color: var(--violeta); box-shadow: var(--brilho); }
    .erro {
      background: rgba(239, 68, 68, .12); border: 1px solid rgba(239, 68, 68, .5); color: #FECACA;
      padding: 12px 16px; border-radius: var(--raio-pequeno); margin-bottom: 16px;
    }

    /* ---------- Aprendizado (T7) ---------- */
    details.aprendizado { background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio); margin-bottom: 12px; }
    details.aprendizado summary {
      cursor: pointer; list-style: none; padding: 18px 22px;
      display: flex; gap: 14px; align-items: center; justify-content: space-between;
    }
    details.aprendizado summary::-webkit-details-marker { display: none; }
    details.aprendizado summary::after { content: "+"; font-family: var(--fonte-dados); font-size: 1.4rem; color: #A78BFA; }
    details.aprendizado[open] summary::after { content: "–"; }
    details.aprendizado .corpo { padding: 0 22px 22px; }
    ol.passos { margin: 8px 0 14px; padding-left: 22px; }
    ol.passos li { margin-bottom: 4px; }

    /* ---------- Ranking ---------- */
    .tabela-rolavel { overflow-x: auto; }
    table.ranking { width: 100%; border-collapse: collapse; }
    table.ranking th, table.ranking td { padding: 14px 10px; border-bottom: 1px solid var(--borda); text-align: left; }
    table.ranking th { font-family: var(--fonte-dados); font-size: .75rem; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; color: var(--suave); }
    table.ranking td.num, table.ranking th.num { text-align: right; }
    table.ranking td.num { font-family: var(--fonte-dados); }
    table.ranking tr.minha td { background: rgba(124, 58, 237, .14); }
    table.ranking tr:last-child td { border-bottom: none; }

    /* ---------- T3: escolha da trilha ---------- */
    .grade.trilhas { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 28px; }
    .trilha-card {
      position: relative; display: flex; flex-direction: column; gap: 10px; margin: 0;
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio);
      padding: 22px; transition: background .15s, border-color .15s, box-shadow .15s, transform .15s;
    }
    .trilha-card:hover, .trilha-card:focus-within { background: var(--card-hover); border-color: var(--violeta); box-shadow: var(--brilho); transform: translateY(-2px); }
    .trilha-card.atual { border-color: var(--violeta); }
    .trilha-card h3 { margin: 6px 0 0; font-size: 1.15rem; }
    .trilha-card p { margin: 0; color: var(--suave); font-size: .95rem; }
    .trilha-card .exemplos { font-family: var(--fonte-dados); font-size: .78rem; color: #A9A2C2; line-height: 1.5; }
    .trilha-card form { margin-top: auto; padding-top: 8px; }
    .link-trilha {
      background: none; border: none; padding: 6px 0; cursor: pointer;
      font: 600 1rem var(--fonte-texto); color: #C4B5FD; display: inline-flex; align-items: center; gap: 8px;
    }
    .link-trilha::after { content: ""; position: absolute; inset: 0; border-radius: var(--raio); }  /* card inteiro clicável */
    .link-trilha:focus-visible { outline: none; }
    .link-trilha .icone { width: 20px; height: 20px; transition: transform .15s; }
    .trilha-card:hover .link-trilha { color: var(--texto); }
    .trilha-card:hover .link-trilha .icone { transform: translateX(4px); }
    .etiqueta {
      align-self: flex-start; font-family: var(--fonte-dados); font-size: .7rem; letter-spacing: 1px; text-transform: uppercase;
      padding: 3px 10px; border-radius: 999px; background: rgba(124, 58, 237, .25); color: #DDD6FE;
    }
    .etiqueta.verde { background: rgba(16, 185, 129, .16); color: #A7F3D0; }
    .etiqueta.vermelha { background: rgba(239, 68, 68, .14); color: #FECACA; }
    .rotulo-cabecalho { font-family: var(--fonte-dados); font-size: .8rem; letter-spacing: 1.2px; text-transform: uppercase; color: var(--suave); }

    /* ---------- T6: progresso entre rodadas ---------- */
    .barra { height: 14px; border-radius: 999px; background: rgba(62, 43, 99, .7); overflow: hidden; margin: 18px 0 10px; }
    .barra span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violeta), var(--purpura)); box-shadow: 0 0 16px rgba(147, 51, 234, .6); }
    .contador { font-family: var(--fonte-dados); color: var(--suave); }
    .card.metrica-grande { text-align: center; padding: 32px 24px; margin: 28px auto 0; max-width: 420px; }
    .card.metrica-grande .valor { font-size: 2.2rem; display: block; margin: 6px 0 10px; }

    /* ---------- Revisão de todas as opções (T5 e T7) ---------- */
    .revisao { display: grid; gap: 12px; }
    .opcao-revisao {
      background: var(--card); border: 1px solid var(--borda); border-left: 4px solid var(--borda);
      border-radius: var(--raio-pequeno); padding: 18px 20px;
    }
    .opcao-revisao.melhor { border-left-color: var(--verde); }
    .opcao-revisao.errada { border-left-color: rgba(239, 68, 68, .7); }
    .opcao-revisao .topo { display: flex; gap: 14px; align-items: flex-start; }
    .opcao-revisao .letra {
      flex: 0 0 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: var(--fonte-dados); font-weight: 800; text-transform: uppercase; border: 1px solid var(--borda); color: #C4B5FD;
    }
    .opcao-revisao.melhor .letra { background: rgba(16, 185, 129, .18); border-color: var(--verde); color: #6EE7B7; }
    .opcao-revisao .etiquetas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
    .opcao-revisao .texto-opcao { font-weight: 600; display: block; }
    .numeros { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 12px 0 10px; font-size: .88rem; color: var(--suave); }
    .numeros .valor { font-size: .95rem; margin-left: 4px; }
    .opcao-revisao p { margin: 0; color: var(--suave); font-size: .95rem; }
    .opcao-revisao p strong { color: var(--texto); }

    /* ---------- T7: diagnóstico do segmento ---------- */
    .card.diagnostico { display: flex; gap: 18px; align-items: flex-start; border-color: rgba(124, 58, 237, .6); }
    .card.diagnostico p:last-child { margin-bottom: 0; }
    .resumo-rodada { display: flex; gap: 14px; align-items: center; }
    .resumo-rodada .icone-quadro { width: 42px; height: 42px; }

    /* ---------- Ranking: filtro por trilha ---------- */
    .filtros { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
    .filtro {
      text-decoration: none; color: var(--suave); font-size: .9rem; padding: 7px 14px;
      border: 1px solid var(--borda); border-radius: 999px;
    }
    .filtro:hover { color: var(--texto); background: var(--card); }
    .filtro.ativo { color: #fff; border-color: var(--violeta); background: rgba(124, 58, 237, .3); }

    .acoes.direita { justify-content: flex-end; }

    footer { text-align: center; color: var(--suave); font-size: .85rem; padding: 0 20px 36px; }
    .tempo { font-family: var(--fonte-dados); font-size: .9rem; color: var(--suave); display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; }
    .tempo .icone { width: 18px; height: 18px; }

    /* ===================================================================
       Redesign IoTSim (protótipo de média fidelidade): tudo liso, sem
       gradientes, brilhos ou sombras; botões em pílula; textos em Inter.
       =================================================================== */
    a { color: #D8B4FE; }
    .marca img { height: 28px; }
    .marca-bzu { display: flex; align-items: center; }
    .marca-bzu img { height: 30px; width: auto; display: block; opacity: .9; }
    header .direita { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; justify-content: flex-end; }
    .ponto.atual { box-shadow: none; border-color: #fff; }
    .ponto.feito { background: var(--violeta); border-color: var(--violeta); }

    h1.titulo-abertura { font-family: var(--fonte-texto); font-weight: 700; text-transform: none; letter-spacing: -.3px; text-shadow: none; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .logo-abertura { display: block; width: min(440px, 86%); height: auto; margin: 24px auto 36px; }

    .badge {
      font-family: var(--fonte-texto); font-size: .85rem; font-weight: 600; letter-spacing: 0; text-transform: none;
      color: var(--texto); background: var(--card); border: 1px solid var(--borda);
    }
    .badge.verde { color: #D1FAE5; background: rgba(16, 185, 129, .18); border-color: rgba(16, 185, 129, .5); }
    .icone-circulo { background: var(--card); box-shadow: none; border-color: var(--borda); }
    .icone-quadro { background: rgba(147, 51, 234, .22); color: #E9D5FF; }

    /* Botões: roxo liso, em pílula, sem sombra e sem seta */
    .botao {
      background: var(--violeta); border-radius: 999px; box-shadow: none;
      font-weight: 600; min-height: 52px; padding: 0 32px;
    }
    .botao:hover { background: var(--violeta-escuro); box-shadow: none; transform: none; }
    .botao .icone { display: none; }
    .botao.secundario { border: 1px solid rgba(255, 255, 255, .35); }
    .botao.secundario:hover { background: var(--card-hover); }

    /* Rótulos e valores na fonte do texto (sem fonte mono) */
    .rotulo { font-family: var(--fonte-texto); font-size: .85rem; font-weight: 700; letter-spacing: .3px; text-transform: none; }
    .valor { font-family: var(--fonte-texto); font-weight: 700; }
    .contador, .rotulo-cabecalho { font-family: var(--fonte-texto); letter-spacing: 0; text-transform: none; font-size: .95rem; }
    .etiqueta { font-family: var(--fonte-texto); font-size: .78rem; font-weight: 600; letter-spacing: 0; text-transform: none; }
    table.ranking th { font-family: var(--fonte-texto); font-size: .85rem; font-weight: 600; letter-spacing: 0; text-transform: none; }
    table.ranking td.num { font-family: var(--fonte-texto); font-variant-numeric: tabular-nums; }
    .tempo { font-family: var(--fonte-texto); font-size: .95rem; margin-top: 28px; }
    .tempo .icone { display: none; }
    details.aprendizado summary::after { font-family: var(--fonte-texto); }
    .campo input:focus, .campo textarea:focus, .campo select:focus { box-shadow: none; border-color: #fff; }

    /* Cards de destaque e insight: lisos */
    .insight { background: var(--card); border-color: var(--violeta); }
    .barra span { background: var(--violeta); box-shadow: none; }

    /* T2: etapas em cards roxos (protótipo) */
    .card.etapa { background: var(--violeta); border-color: var(--violeta); }
    .card.etapa h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .card.etapa p { color: rgba(255, 255, 255, .92); }
    .card.etapa .icone-quadro, .card.etapa .numero-etapa { display: none; }
    details.explica { margin: 0; }
    details.explica summary {
      list-style: none; cursor: pointer; text-align: center; font-weight: 700;
      background: var(--violeta); border-radius: var(--raio-pequeno); padding: 16px 20px;
    }
    details.explica summary::-webkit-details-marker { display: none; }
    details.explica summary:hover, details.explica[open] summary { background: var(--violeta-escuro); }
    details.explica p { margin: 12px 4px 0; color: var(--suave); }

    /* T3: segmentos como botões roxos grandes */
    .grade.trilhas { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .trilha-card {
      background: var(--violeta); border-color: var(--violeta); min-height: 120px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .trilha-card:hover, .trilha-card:focus-within { background: var(--violeta-escuro); border-color: #fff; box-shadow: none; transform: none; }
    .trilha-card.atual { border-color: #fff; }
    button.trilha-card { width: 100%; height: 100%; cursor: pointer; color: #fff; font: inherit; gap: 8px; }
    .trilha-nome { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
    .trilha-exemplos { font-size: .88rem; line-height: 1.45; color: rgba(255, 255, 255, .85); max-width: 30ch; }
    .trilha-card .etiqueta { align-self: center; background: rgba(255, 255, 255, .2); color: #fff; }
    .grade.trilhas form { margin: 0; }

    /* T4: pergunta e alternativas em barras roxas */
    .label-decisao {
      font-family: var(--fonte-texto); font-size: 1.3rem; font-weight: 700; letter-spacing: 0;
      text-transform: none; color: var(--texto); margin: 36px 0 14px;
    }
    .opcao { background: var(--violeta); border-color: var(--violeta); border-width: 2px; }
    .opcao:hover { background: var(--violeta-escuro); }
    .opcao:has(input:checked) { background: var(--violeta-escuro); border-color: #fff; box-shadow: none; }
    .opcao .letra { font-family: var(--fonte-texto); font-weight: 700; border-color: rgba(255, 255, 255, .6); color: #fff; }
    .opcao:has(input:checked) .letra { background: #fff; border-color: #fff; color: var(--violeta-escuro); }
    .opcao .descricao-opcao { font-family: var(--fonte-texto); color: rgba(255, 255, 255, .88); font-size: .92rem; }

    /* T5 e T7: cards "sem IoT" (vermelho) e "com IoT" (verde) cheios */
    .card.sem, .card.com { color: #180E29; border: none; box-shadow: none; }
    .card.sem { background: var(--vermelho); }
    .grade.duas > .card.sem { order: -1; }   /* protótipo: vermelho sempre à esquerda */
    .card.com { background: var(--verde); }
    .card.sem .rotulo, .card.com .rotulo, .card.sem .suave, .card.com .suave,
    .card.sem .metrica small, .card.com .metrica small { color: rgba(24, 14, 41, .82); }
    .card.sem .valor, .card.com .valor { color: #180E29; }
    .card.sem .metrica, .card.com .metrica { border-bottom-color: rgba(24, 14, 41, .22); }

    /* T6: card de prejuízo acumulado em vermelho */
    .card.metrica-grande { background: var(--vermelho); border: none; color: #180E29; }
    .card.metrica-grande .suave, .card.metrica-grande .valor { color: #180E29; }

    /* T7: "Dashboard" roxo com os indicadores */
    .painel-roxo { background: var(--violeta); border-radius: var(--raio); padding: 22px; margin: 4px 0 18px; }
    .painel-roxo .destaques { margin: 0; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .painel-roxo .destaque { background: rgba(24, 14, 41, .35); border-color: transparent; }
    .painel-roxo .destaque small { color: rgba(255, 255, 255, .85); }
    .painel-roxo .valor.positivo, .painel-roxo .valor.negativo { color: #fff; }

    .filtro.ativo { background: var(--violeta); border-color: var(--violeta); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    @media (max-width: 600px) {
      body { font-size: 16px; }
      main { padding: 28px 16px 56px; }
      h1 { font-size: 1.55rem; }
      .card { padding: 20px; }
      .card.situacao { flex-direction: column; }
      .acoes .botao { width: 100%; }
      .card.diagnostico { flex-direction: column; }
      .card.metrica-grande .valor { font-size: 1.8rem; }
      header nav a { margin-left: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  {% block estilos %}{% endblock %}
</head>
<body>
  <header>
    <div class="conteudo">
      {% block marca %}
        <a href="{% url 'simulador:inicio' %}" class="marca" aria-label="IoTSim - início do simulador">
          <img src="/static/simulador/img/iotsim-texto.png" alt="IoTSim"
               onerror="this.parentNode.classList.add('sem-imagem')">
          <span class="logo-texto">IoT<span>SIM</span></span>
        </a>
      {% endblock %}
      <div class="direita">
        {% block cabecalho_direita %}
          <nav>
            <a href="{% url 'simulador:inicio' %}">Simulador</a>
            <a href="{% url 'simulador:ranking' %}">Ranking</a>
          </nav>
        {% endblock %}
        <span class="marca-bzu"><img src="/static/simulador/img/logo-bzu-tech-clara.png" alt="Bzu Tech"></span>
      </div>
    </div>
  </header>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
  <footer>Bzu Tech</footer>
</body>
</html>
