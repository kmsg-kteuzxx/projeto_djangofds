# CI/CD do Smart Solve (Entrega 04)
#
# A cada push ou pull request:
#   1. build: instala as dependências, confere as migrações e roda collectstatic;
#   2. testes: roda os testes de unidade (BDD) e os testes de sistema (E2E) com Selenium;
#   3. deploy: SÓ se tudo passou e o push foi na main, pede o deploy ao Render.
#
# Configuração (uma vez só):
#   - No Render: Settings → Build & Deploy → "Auto-Deploy" = No (quem publica é este pipeline).
#   - No Render: Settings → copie o "Deploy Hook".
#   - No GitHub: Settings → Secrets and variables → Actions → New repository secret
#       nome: RENDER_DEPLOY_HOOK_URL   valor: o Deploy Hook copiado.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      SECRET_KEY: chave-so-para-o-ci
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Build (migrações e arquivos estáticos)
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --no-input
          python manage.py migrate --no-input

      - name: Testes de unidade (cenários BDD)
        run: python manage.py test simulador --exclude-tag=e2e -v 2

      - name: Instalar Chrome e ChromeDriver (mesma versão)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Testes de sistema (E2E com Selenium)
        env:
          E2E_OBRIGATORIO: "1"
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: python manage.py test simulador --tag=e2e -v 2

  deploy:
    name: Deploy no Render
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pedir o deploy ao Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            # Enquanto o secret não existe, o Render continua com o Auto-Deploy dele.
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL ainda não configurado: deploy pelo pipeline pulado (veja o topo deste arquivo)."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Deploy pedido ao Render: https://projeto-djangofds.onrender.com/simulador/"
